name: Manual coverage gate
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to measure (Android requires the dedicated local emulator)
        type: choice
        options: [backend, frontend]
        required: true
        default: frontend
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: inputs.platform == 'frontend'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: inputs.platform == 'frontend'
        run: npm ci --prefix frontend
      - name: Install backend dependencies
        if: inputs.platform == 'backend'
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Verify accounting and run coverage
        env:
          COVERAGE_PYTHON: python
          COVERAGE_PLATFORM: ${{ inputs.platform }}
        run: |
          python -m unittest discover -s scripts -p test_coverage_gate.py
          python scripts/coverage_gate.py "$COVERAGE_PLATFORM"
      - name: Enforce per-area thresholds
        if: always()
        env:
          COVERAGE_PLATFORM: ${{ inputs.platform }}
        run: python scripts/coverage_gate.py report --target-profile sprint_risk_reduction --platform "$COVERAGE_PLATFORM"
      - name: Retain coverage and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ inputs.platform }}
          path: output/coverage/
          retention-days: 14
